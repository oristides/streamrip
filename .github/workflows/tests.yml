name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # Bumped from 3.10 to 3.12 to match local development. Several
        # dependencies in poetry.lock now require >=3.10 and tests on 3.10
        # fail with import errors that don't reproduce locally.
        python-version: '3.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.5.1
        virtualenvs-create: false
        virtualenvs-in-project: true

    - name: Install dependencies
      run: poetry install --with dev

    - name: Install ffmpeg
      # The repair tests build synthetic noise / sine fixtures with ffmpeg
      # and verify reconstructed DASH audio. Without this those tests
      # skip, but several repair regressions would also go undetected.
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Run unit tests
      run: poetry run pytest tests/ -v
